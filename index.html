<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CRACKUZU – Répertoire de jeux PC via Crackuzu.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="logo.png">
<title>CRACKUZU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Feuilles de styles modulaires -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/pages/accueil.css">
<link rel="stylesheet" href="css/pages/catalogue.css">
<link rel="stylesheet" href="css/pages/jeu.css">
<link rel="stylesheet" href="css/pages/demande.css">
<link rel="stylesheet" href="css/pages/admin.css">
</head>
<body>
<!-- ═══════════════════════════════════════════════════════
     HEADER PERMANENT
════════════════════════════════════════════════════════ -->
<header class="header" id="hdr">
  <div class="nav">
    <div class="nav-inner">
      <div class="logo-link" onclick="nav('accueil')">
        <div class="logo-text"><span>Crack</span><span class="logo-dim">uzu</span></div>
      </div>
      <div class="nav-links">
        <ul>
          <li><button class="nav-a" id="nav-accueil"  onclick="nav('accueil')">Accueil</button></li>
          <li><button class="nav-a" id="nav-catalogue" onclick="nav('catalogue')">Catalogue</button></li>
          <li><button class="nav-a" id="nav-demande" onclick="nav('demande')">Demande</button></li>
          <li><button class="nav-a" id="nav-admin"    onclick="nav('admin')">Admin</button></li>
        </ul>
      </div>
      <div class="nav-right">
        <button class="search-pill" onclick="openSrch()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
          <span>Rechercher</span>
        </button>
        <button class="icon-btn mob-search" onclick="openSrch()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
        </button>
        <div class="notif-wrapper">
          <button class="icon-btn" id="notifBtn" onclick="toggleNotifs(event)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="notif-badge" id="notifBadge"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-header">
              <span>Notifications</span>
            </div>
            <div class="notif-list" id="notifList">
              <div class="notif-empty">Chargement…</div>
            </div>
          </div>
        </div>
        <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <button class="mob-nav-a" id="mnav-accueil" onclick="nav('accueil');closeMobileMenu()">Accueil</button>
      <button class="mob-nav-a" id="mnav-catalogue" onclick="nav('catalogue');closeMobileMenu()">Catalogue</button>
      <button class="mob-nav-a" id="mnav-demande" onclick="nav('demande');closeMobileMenu()">Demande</button>
      <button class="mob-nav-a" id="mnav-admin" onclick="nav('admin');closeMobileMenu()">Admin</button>
    </div>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════
     ZONE DE CONTENU (swapée par le routeur)
════════════════════════════════════════════════════════ -->
<div id="spa-view"></div>

<!-- SEARCH OVERLAY (permanent, shared with Demande) -->
<div class="sov" id="sov" onclick="if(event.target===this)closeSrch()">
  <div class="sbox">
    <span class="sico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg></span>
    <input class="sinput" id="sinput" type="text" placeholder="Chercher un jeu…" autocomplete="off" oninput="doSrch(this.value)">
    <button class="sx" onclick="closeSrch()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="sres" id="sres"></div>
</div>

<!-- ═══════════════════════════════════════════════════════
     FOOTER PERMANENT
════════════════════════════════════════════════════════ -->
<footer class="site-footer" id="site-footer">
  <div class="ft"><span>Crack</span><span class="dim">uzu</span></div>
  <p class="fts">Répertoire non officiel.</p>
  <p class="ftn">Made by CHVRUZU</p>
</footer>

<!-- ═══════════════════════════════════════════════════════
     TEMPLATES DE PAGES (cachés)
════════════════════════════════════════════════════════ -->
<template id="tpl-accueil">
<!-- MODAL -->
<div class="mov" id="mov" onclick="movck(event)">
  <div class="modal">
    <div class="mcw" style="position:relative">
      <button class="mcx" onclick="closeMod()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <img id="mcov" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover">
      <div id="mnocov" style="display:none;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);align-items:center;justify-content:center;font-size:4rem">🎮</div>
      <div class="mcgrad"></div>
    </div>
    <div class="mbody">
      <div class="mname" id="mname"></div>
      <div class="mpills">
        <span id="mv" class="mpv"></span>
        <span id="msrc" class="mps"></span>
        <span class="msep">•</span>
        <span id="msz" class="mp"></span>
        <span class="msep">•</span>
        <span id="mdt" class="mp"></span>
      </div>
      <div class="mact" id="mact">
        <a id="mmag" href="#" class="btn-orange" style="flex:1;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="22"/></svg>
          Télécharger
        </a>
        <button class="btn-ghost" onclick="closeMod()" style="padding:.75rem 1rem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <p class="mhint">Ouvre Crackuzu pour télécharger via magnet</p>
    </div>
  </div>
</div>

<!-- HOME -->
<div id="hv">
  <section class="hero">
    <div class="hero-slides" id="hslides"></div>
    <div class="hero-gl"></div><div class="hero-gb"></div><div class="hero-gt"></div>
    <div class="hero-body">
      <div class="hero-inner">
        <div class="hero-info" id="hinfo">
          <div class="hero-badges">
            <div class="badge-new">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="color:#f97316"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <span>Nouveau</span>
            </div>
            <span class="badge-src" id="hbsrc">—</span>
          </div>
          <div class="hero-title-wrap">
            <h2 class="hero-title" id="htitle">Chargement…</h2>
          </div>
          <div class="hero-meta">
            <span class="hm" id="hver"></span>
            <span class="hsep" id="hvsep"></span>
            <span class="hm" id="hsz"></span>
            <span class="hsep">•</span>
            <span class="hm" id="hdt"></span>
          </div>
          <div class="hero-actions">
            <a class="btn-orange" id="hmag" href="#" onclick="openHeroDownload(event)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
              Télécharger
            </a>
            <a class="btn-ghost" href='#' onclick="nav('catalogue');return false" style="text-decoration:none;display:inline-flex;align-items:center;gap:.5rem">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              Voir le catalogue
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-dots" id="hdots"></div>
  </section>

  <div class="content">
    <section class="section">
      <div class="sw">
        <div class="sh">
          <div class="sl"><span class="se">Derniers ajouts</span><h2 class="st">Récents</h2></div>
          <span style="font-size:11px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.15em" id="rcnt"></span>
        </div>
        <div class="row-wrap">
          <button class="ra ra-l" onclick="sl('rrow')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="ra ra-r" onclick="sr('rrow')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="row-track" id="rrow"><div class="ldr"><div class="spin"></div><span class="ltxt">Chargement…</span></div></div>
        </div>
      </div>
    </section>
    <div id="srcrows"></div>
  </div>
</div>

</template>

<template id="tpl-catalogue">
<div class="glow-l"></div>
<div class="glow-r"></div>

<!-- MODAL -->
<div class="mov" id="mov" onclick="if(event.target===this)closeMod()">
  <div class="modal" id="modal-box">
    <div class="m-banner">
      <button class="m-close" onclick="closeMod()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <img id="m-img" src="" alt="" style="display:none">
      <div id="m-trailer" style="display:none;width:100%;height:100%"></div>
      <div id="m-noimg" style="display:none;width:100%;height:100%;background:linear-gradient(135deg,#1a1210,#0a0a0a);align-items:center;justify-content:center;font-size:5rem">🎮</div>
      <div class="m-banner-grad"></div>
      <div class="m-yt-btn" id="m-ytbtn" style="display:none" onclick="openTrailer()">
        <div class="m-yt-inner">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        </div>
      </div>
    </div>
    <div class="m-body">
      <div class="m-title" id="m-title"></div>
      <div class="m-pills" id="m-pills"></div>
      <div class="m-desc" id="m-desc"></div>
      <div class="m-actions" id="m-actions"></div>
      <div class="m-mag-sec" id="m-mag-sec" style="display:none">
        <div class="m-mag-lbl">Télécharger via Crackuzu</div>
        <div class="m-mag-list" id="m-mag-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="page">
  <div class="container">

    <div class="page-head">
      <h1 class="page-title"><span class="page-title-inner">Catalogue</span><span class="orange">.</span></h1>
      <p class="page-sub">Tous les jeux disponibles — télécharge via Crackuzu.</p>
    </div>

    <div class="filters">
      <div class="filter-row">
        <div class="fl-left">
          <div class="sort-pill">
            <button class="stab on" id="sort-new" onclick="setSort('new')">Récents</button>
            <button class="stab" id="sort-az"  onclick="setSort('az')">A–Z</button>
          </div>
          <div class="inline-srch">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
            <input type="text" id="cq" placeholder="Filtrer par nom…" oninput="applyFilters()">
          </div>
        </div>
        <div class="fl-right">
          <button class="filter-btn" id="filterBtn" onclick="toggleFilterDropdown()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            <span>Filtres</span>
          </button>
          <div class="filter-dropdown" id="filterDropdown">
            <div class="filter-dropdown-header">
              <span>Catégories</span>
            </div>
            <div class="filter-dropdown-body" id="filterCats"></div>
            <div class="filter-dropdown-footer">
              <button class="filter-reset" onclick="clearCategoryFilter()">Réinitialiser tout</button>
              <button class="filter-apply" onclick="closeFilterDropdown()">Appliquer les filtres</button>
            </div>
          </div>
          <span class="res-count" id="res-count"></span>
        </div>
        <button class="qbit-btn" onclick="dlQbit()" title="Télécharger qBittorrent">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>qBittorrent</span>
        </button>
      </div>
    </div>

    <div class="grid" id="grid">
      <div class="loader"><div class="spin"></div><span class="spin-txt">Chargement…</span></div>
    </div>
    <div class="pag" id="pag"></div>

  </div>
</main>

</template>

<template id="tpl-jeu">
<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg">
    <img src="" alt="" id="heroImg">
  </div>
  
  <a onclick="nav('catalogue')" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Retour
  </a>
  
  <div class="hero-content">
    <div class="genres" id="genres"></div>
    <h1 class="jeu-hero-title" id="gameTitle">Chargement...</h1>
    <img class="jeu-hero-title-img" id="gameTitleImg" src="" alt="" style="display:none">
    
    <div class="meta" id="meta">
      <div class="meta-item yellow" id="rating" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="ratingValue"></span>
      </div>
      <div class="meta-item" id="yearItem" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span id="yearValue"></span>
      </div>
      <div class="meta-item" id="catItem" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
        <span id="catValue"></span>
      </div>
    </div>
    
    <div class="actions" id="actions" style="display:none">
      <button class="btn-primary" id="downloadBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        Télécharger
      </button>
      <button class="btn-secondary" id="trailerBtn" title="Bande-annonce" style="display:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    
    <div class="synopsis" id="synopsis">
      <p id="descText">Chargement des données...</p>
    </div>
    
    <div class="info-grid" id="infoGrid" style="display:none">
      <div class="info-item">
        <div class="info-label" id="label1">Source</div>
        <div class="info-value" id="sourceValue">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">Type</div>
        <div class="info-value" id="typeValue">-</div>
      </div>
      <div class="info-item">
        <div class="info-label" id="label3">Taille</div>
        <div class="info-value" id="sizeValue">-</div>
      </div>
    </div>
  </div>
</section>

<!-- YouTube Player Modal -->
<div id="trailerOverlay" style="display:none;opacity:0;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:9999;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box;transition:opacity .4s ease" onclick="closeTrailer(event)">
  <div id="trailerBox" style="position:relative;width:95vw;max-width:1400px;aspect-ratio:16/9;background:#000;border-radius:1.5rem;overflow:hidden;box-shadow:0 0 100px rgba(249,115,22,.3),0 0 200px rgba(0,0,0,.8);transform:scale(.8);opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1)" onclick="event.stopPropagation()">
    <iframe id="trailerFrame" style="width:100%;height:100%;border:0;display:block" allow="autoplay;encrypted-media" allowfullscreen></iframe>
    <button onclick="closeTrailer()" style="position:absolute;top:1.5rem;right:1.5rem;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(10px)" onmouseover="this.style.background='rgba(249,115,22,.8)';this.style.transform='scale(1.1)'" onmouseout="this.style.background='rgba(255,255,255,.15)';this.style.transform='scale(1)'">×</button>
  </div>
</div>

<!-- CONTENT -->
<div class="container" id="content" style="display:none">
</div>

<!-- Download Menu Modal -->
<div id="downloadModal" style="display:none;opacity:0;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.15);backdrop-filter:blur(25px);z-index:9998;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box;transition:opacity .3s ease" onclick="closeDownloadMenu(event)">
  <div id="downloadBox" style="position:relative;width:100%;max-width:600px;max-height:80vh;overflow-y:auto;background:rgba(15,15,15,.7);border-radius:1.5rem;border:1px solid rgba(249,115,22,.3);box-shadow:0 25px 50px rgba(0,0,0,.3);transform:scale(.9);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)" onclick="event.stopPropagation()">
    <div style="padding:2rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
        <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin:0">Télécharger</h2>
        <button onclick="closeDownloadMenu()" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s" onmouseover="this.style.background='rgba(249,115,22,.8)'" onmouseout="this.style.background='rgba(255,255,255,.1)'">×</button>
      </div>
      <div id="downloadList"></div>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <span>Chargement du jeu...</span>
</div>

<!-- NOT FOUND -->
<div class="not-found" id="notFound" style="display:none">
  <h1>404</h1>
  <p>Jeu non trouvé</p>
  <button class="btn-primary" onclick="location.href='#' onclick="nav('accueil');return false"">Retour à l'accueil</button>
</div>
</template>

<template id="tpl-admin">
<!-- DISCORD AUTH OVERLAY -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box" style="position:relative">
      <div class="auth-title">Accès Restreint</div>

    <div class="req-section">

        <input class="req-search" id="reqSearch" type="text" placeholder="Nom du jeu…" autocomplete="off" onfocus="openSrchSteam()" readonly>
      </div>

      <!-- Preview -->
      <div class="req-preview" id="reqPreview">

          <div class="req-preview-desc" id="reqPreviewDesc"></div>

    <div class="req-submit-wrap">
